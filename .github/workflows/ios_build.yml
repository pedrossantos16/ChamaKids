name: Build iOS and Android

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Android APK
        if: matrix.os == 'ubuntu-latest'
        run: ./gradlew :composeApp:assembleDebug

      - name: Build iOS Framework
        if: matrix.os == 'macos-latest'
        run: ./gradlew :composeApp:linkReleaseFrameworkIosArm64

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: chamakids-${{ matrix.os }}
          path: |
            composeApp/build/outputs/apk/debug/*.apk
            composeApp/build/bin/iosArm64/releaseFramework/ComposeApp.framework
