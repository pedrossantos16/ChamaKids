name: Build iOS and Android

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # SOLUÇÃO 1: Aceitar licenças do SDK do Android (Conforme sua pesquisa)
      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses || true

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # SOLUÇÃO 2: Forçar o Java Home para evitar o erro 25.0.3
      - name: Build Android APK
        run: ./gradlew :composeApp:assembleDebug -Dorg.gradle.java.home=$JAVA_HOME_17_X64

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: chamakids-android
          path: composeApp/build/outputs/apk/debug/*.apk

  build-ios:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # Aceitar licenças também no ambiente do iPhone
      - name: Accept Android SDK licenses (iOS)
        run: yes | sdkmanager --licenses || true

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # Build do iPhone com Java Home travado
      - name: Build iOS Framework
        run: ./gradlew :composeApp:linkReleaseFrameworkIosArm64 -Dorg.gradle.java.home=$JAVA_HOME_17_X64

      - name: Upload iOS Framework
        uses: actions/upload-artifact@v4
        with:
          name: chamakids-ios
          path: composeApp/build/bin/iosArm64/releaseFramework/ComposeApp.framework
