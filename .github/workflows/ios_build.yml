name: Build iOS and Android

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # ESTRATÉGIA DE FORÇA BRUTA: Deletar ferramentas velhas que causam o erro 25.0.3
      - name: Remove problematic Android build tools
        run: |
          rm -rf $ANDROID_SDK_ROOT/build-tools/25.0.3
          rm -rf $ANDROID_SDK_ROOT/build-tools/25.0.4.1
          rm -rf $ANDROID_SDK_ROOT/build-tools/25.0.2

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Android APK
        run: ./gradlew :composeApp:assembleDebug --no-configuration-cache

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: chamakids-android-debug
          path: composeApp/build/outputs/apk/debug/*.apk

  build-ios:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # Mesma limpeza no ambiente macOS do iPhone
      - name: Remove problematic Android build tools (macOS)
        run: |
          rm -rf $ANDROID_HOME/build-tools/25.0.3
          rm -rf $ANDROID_HOME/build-tools/25.0.4.1

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build iOS Framework
        run: ./gradlew :composeApp:linkReleaseFrameworkIosArm64 --no-configuration-cache

      - name: Upload iOS Framework
        uses: actions/upload-artifact@v4
        with:
          name: chamakids-ios-framework
          path: composeApp/build/bin/iosArm64/releaseFramework/ComposeApp.framework
